name: model
# Daily: ingest AFL StatsPro → features → train → emit artifacts.
# (Projections/MC + site live in the AFL-23-0 repo, which consumes artifacts/.)
on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC daily
  workflow_dispatch:
concurrency:
  group: afl-model
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/ingest.py
      - run: python src/features.py
      - run: python src/train.py
      - name: Commit refreshed artifacts
        run: |
          git config user.name  "afl-model-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed/player_match.parquet models/*.joblib artifacts/*.json reports/*.csv reports/*.json || true
          git commit -m "Refresh model artifacts [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
