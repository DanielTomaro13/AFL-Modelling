name: model
# Daily: ingest AFL StatsPro → features → train → emit artifacts.
# (Projections/MC + site live in the AFL-23-0 repo, which consumes artifacts/.)
on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC daily
  workflow_dispatch:
permissions:
  contents: write          # else the default GITHUB_TOKEN is read-only and the
                           # artifact push 403s (predict.yml already sets this)
concurrency:
  group: afl-model
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/ingest.py
      - run: python src/features.py
      - run: python src/train.py
      # Emit projection_inputs.json for the next round. predict.py fetches the
      # round rosters (confirmed lineups when available, else most-recent-XVIII
      # proxy), so this is what carries new lineups through to the AFL-23-0 site.
      # The lighter predict.yml re-runs this alone every 3h between daily trains.
      - run: python src/predict.py
      - name: Commit refreshed artifacts
        run: |
          git config user.name  "afl-model-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed/player_match.parquet models/afl_models.joblib artifacts/*.json reports/*.csv || true
          if git diff --cached --quiet; then
            echo "No model changes to commit."
            exit 0
          fi
          git commit -m "Refresh model artifacts [skip ci]"
          # predict.yml pushes lineup refreshes to main every 3h, so this push is
          # usually behind remote. Rebase-retry instead of a bare push whose
          # rejection was silently swallowed — that left the committed joblib
          # stale for days and broke predict.yml's load.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $i) — rebasing onto latest main..."
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1
